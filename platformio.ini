; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-poe]
platform = espressif32
board = esp32-poe
framework = arduino

monitor_port = /dev/tty.usbserial-14219
monitor_speed = 115200
upload_port = /dev/tty.usbserial-14210

; Convertor html to Cpp python 
;extra_scripts = pre:extra_script.py
;custom_in_html = src/FrameWeb.html
;custom_out_h = src/FrameWeb.cpp

lib_deps = # Using a library name
   https://github.com/tzapu/WiFiManager.git#master
   https://github.com/Links2004/arduinoWebSockets#master
   DNSServer
   WebServer
   ArduinoJson
	https://github.com/dupuyb/Esp32_Framework.git

build_src_filter = +<*> 
   -<.git/> 
   -<.svn/> 
   -<main_wifi.cpp> 
   -<main_bt.cpp> 
   -<main_eth.cpp> 
   -<.pio/libdeps/esp32-poe/Esp32_Framework/src/demo1.cpp>